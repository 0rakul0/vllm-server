services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-openai
    ipc: host

    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --download-dir /models
      --host 0.0.0.0
      --port 8008
      --gpu-memory-utilization 0.50
      --max-model-len 1024
      --max-num-seqs 1
      --enforce-eager

    shm_size: "8gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - E:/vllm-server/models:/models

    ports:
      - "8008:8008"

    environment:
      HF_TOKEN: ${HF_TOKEN}